name: Build and Release

# 构建 fnOS 应用包（.fpk）并挂到 GitHub Release 上。
#
# ── 触发方式 ──────────────────────────────────────────────────
#   · workflow_dispatch（ref = tag）：**自动升级走的就是这条路**。
#     由 check-upstream.yml 在「定时检查发现上游新版本 → 改版本号 → 提交 main →
#     打 tag」之后派发过来，ref 就是刚打的那个 tag。
#   · push tag v*：人工手动推 tag 时等价生效（构建 + 发布）。
#     注意用内置 GITHUB_TOKEN 推的 tag **不会**触发这里（GitHub 防递归规则），
#     只有 workflow_dispatch / repository_dispatch 两个事件例外 —— 所以自动升级
#     必须靠上面那条「派发」。详见 check-upstream.yml 的文件头。
#   · workflow_dispatch（ref = 分支）：只构建，产物作为 artifact 下载，不发布
#     Release（github.ref 不是 refs/tags/*，Release 步骤自动跳过）。
#     要在此情况下也发布，勾 force_release。
#
# ── 与旧版（检查 + 构建 + 发布挤在一个 workflow 里）的差别 ───────
# 检查与改版本号的部分搬到了 check-upstream.yml，这里只剩「构建 + 发布」。
# 好处是发布路径只有一份、职责清晰；代价是「先构建、后提交」那个保证没有了
# （版本号在派发之前就已经提交进 main）。兜底见 check-upstream.yml 的
# 「幂等 / 自愈」一节：万一这里失败，下次定时检查会发现「tag 在、Release 不在」
# 并自动补一次派发；也可以随时手动重跑本 workflow、ref 填该 tag。
#
# ── 发布说明 ──────────────────────────────────────────────────
# 直接用 manifest 的 changelog —— 它只保留**最新一版**的记录（见
# scripts/upstream_sync.py 的 bump_manifest），正好就是本次发布的更新日志。
#
# ── 发布用的凭据 ──────────────────────────────────────────────
# 用 Actions 内置的 secrets.GITHUB_TOKEN，不需要额外配 PAT —— 顶层
# permissions: contents: write 已经给它 Release 写权限。

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      # 网页手动触发时 ref 只能选分支或 tag。选分支时 github.ref 不是
      # refs/tags/*，下面「创建 Release」默认跳过 —— 这个开关用来在分支上
      # 也发一版（tag 名取 manifest 里的版本号，去掉 -N 后缀）。
      force_release:
        description: '即使在分支上也创建 Release（tag 用 manifest 里的版本号）'
        type: boolean
        default: false

# 需要写权限：创建 Release、上传 Release 资产
permissions:
  contents: write

# 两次运行重叠会互相抢同一个 Release；排队而不是取消，避免半截状态
concurrency:
  group: build-and-release
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  # runner 能直连 github.com，不用 build.py 里的国内镜像代理
  FNOX_NO_GH_PROXY: "1"

jobs:
  build:
    name: 构建 / 发布
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          # 要按 tag 检出并核对 tag 指向的提交，浅克隆不够用
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 版本号一律以仓库里的 manifest 为准（check-upstream.yml 已经把它改成
      # 目标版本，并提交在 tag 指向的提交里）。
      - name: 读取版本号
        id: ver
        run: |
          set -euo pipefail
          # 都带 || true：开了 pipefail 时 grep 找不到会因非零状态把整行赋值打挂，
          # 那样会以一句莫名其妙的 shell 报错收场；下面显式判空，报错更清楚。
          APP_VERSION=$(grep '^version[[:space:]]*=' manifest | sed 's/^version[[:space:]]*=[[:space:]]*//' | tr -d '[:space:]' || true)
          UPSTREAM_TAG=$(grep '^UPSTREAM_TAG[[:space:]]*=' build.py | sed 's/^UPSTREAM_TAG[[:space:]]*=[[:space:]]*//' | tr -d '[:space:]"' || true)
          if [ -z "$APP_VERSION" ]; then
            echo "ERROR: 读不到 manifest 的 version"
            exit 1
          fi
          echo "version=$APP_VERSION"       >> "$GITHUB_OUTPUT"
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "包版本 $APP_VERSION（上游 $UPSTREAM_TAG）"

      # 发布用的 tag：优先用触发的 ref（派发时是 tag）；在分支上手动跑且勾了
      # force_release 时，用 manifest 版本号去掉 -N 后缀拼一个。
      - name: 决定发布 tag
        id: tag
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release || false }}
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/tags/*)
              TAG="${GITHUB_REF#refs/tags/}"
              echo "触发 ref 就是 tag：${TAG}"
              ;;
            *)
              if [ "${FORCE_RELEASE}" = "true" ]; then
                TAG="v${APP_VERSION%-*}"
                echo "在分支 ${GITHUB_REF} 上强制发布，tag 取 manifest 版本号：${TAG}"
              else
                TAG=""
                echo "ref=${GITHUB_REF} 不是 tag 且未勾 force_release —— 只构建，不发布"
              fi
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          # 关掉 setup-go 自带的缓存：它按仓库里的 go.sum 算 key，而占大头的
          # 上游依赖（构建时才下载到 .local-build/upstream-src）不在仓库里，
          # 缓存基本命中不了。下面用上游 tag 当 key 自己缓存，更准。
          cache: false

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      # Go 模块缓存按上游 tag 分桶：tag 变了说明依赖可能变，自然换一份新缓存，
      # 不会拿旧依赖去编译新源码。恢复不到只是慢一点，不影响正确性。
      - name: 缓存 Go 模块
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ steps.ver.outputs.upstream_tag }}-${{ hashFiles('fngateway/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ steps.ver.outputs.upstream_tag }}-
            gomod-${{ runner.os }}-

      - name: 构建 fpk（amd64 + arm64）
        run: |
          set -euo pipefail
          python build.py --arch all

      - name: 收集构建产物
        run: |
          set -euo pipefail
          ls -l ./*.fpk
          sha256sum ./*.fpk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # 同一 tag 重复发布（重跑、补发）会因「已存在」失败，留下 tag/Release
      # 不一致；先删再建。**不带 --cleanup-tag**：tag 要留着，check-upstream.yml
      # 靠「tag 在、Release 不在」判断是否需要自愈补发，删掉 tag 这条线索就断了。
      - name: 创建 Release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          VER: ${{ steps.ver.outputs.version }}
          UPSTREAM_TAG: ${{ steps.ver.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          gh release delete "$TAG" --yes 2>/dev/null || true

          # 发布说明取 manifest 的 changelog（只含最新一版），把 <br> 还原成换行。
          # 末尾的 || true 是为了配合 set -o pipefail：grep 找不到不该以 shell
          # 报错收场，下面显式判空。
          NOTES=$(grep '^changelog[[:space:]]*=' manifest \
                  | sed 's/^changelog[[:space:]]*=[[:space:]]*//' \
                  | sed 's/<br>/\n/g' || true)
          if [ -z "$NOTES" ]; then
            echo "ERROR: manifest 里读不到 changelog，拒绝发一个没有说明的 Release"
            exit 1
          fi
          {
            echo "## cli2api ${VER}（上游 ${UPSTREAM_TAG}）"
            echo
            echo "$NOTES"
            echo
            echo "---"
            echo
            echo "上游仓库：[\`caigee-cmd/cli2api\`](https://github.com/caigee-cmd/cli2api)（锁定 \`${UPSTREAM_TAG}\`）"
            echo
            echo "| 文件 | 说明 |"
            echo "| --- | --- |"
            echo "| \`cli2api-${VER}-amd64.fpk\` | x86_64 |"
            echo "| \`cli2api-${VER}-arm64.fpk\` | ARM64 |"
            echo "| \`SHA256SUMS.txt\` | 校验和 |"
          } > "$RUNNER_TEMP/release-notes.md"

          gh release create "$TAG" \
            --title "cli2api $VER（上游 $UPSTREAM_TAG）" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            ./*.fpk SHA256SUMS.txt

      # 发布用的资产之外再留一份 Actions 产物，方便排查和重发
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: fpk-${{ steps.ver.outputs.version }}
          path: |
            *.fpk
            SHA256SUMS.txt
          retention-days: 14

      - name: 记录结果
        if: always()
        env:
          VER: ${{ steps.ver.outputs.version }}
          UPSTREAM_TAG: ${{ steps.ver.outputs.upstream_tag }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "## 构建发布结果"
            echo
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 包版本 | \`${VER:-n/a}\` |"
            echo "| 上游 tag | \`${UPSTREAM_TAG:-n/a}\` |"
            echo "| 发布 tag | \`${TAG:-（不发布）}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

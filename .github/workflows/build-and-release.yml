name: Build and Release

# 每 2 天检查一次上游 caigee-cmd/cli2api：
#   有新版本 → 改 build.py 的 UPSTREAM_TAG + manifest 版本与 changelog + README，
#              构建 amd64/arm64 两个 fpk，提交推回 main，并建一个带 fpk 的 Release
#   没新版本 → 直接跳过（不构建、不提交、不发布），流程仍是绿的
#
# cron 用 UTC。这里取 04:17 UTC = 12:17 北京时间（避开整点，减少排队）。
# GitHub 的 schedule 在仓库 60 天无活动后会暂停，届时手动跑一次即可恢复。
on:
  schedule:
    - cron: "17 4 */2 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略上游比较，重新出一次包（若上游已有更新版本，会顺带带上新版本）"
        type: boolean
        default: false

# 需要写权限：提交版本号回 main、创建 Release、上传 Release 资产
permissions:
  contents: write

# 两次运行重叠会互相抢 commit/Release；排队而不是取消，避免半截状态
concurrency:
  group: build-and-release
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  # runner 能直连 github.com，不用 build.py 里的国内镜像代理
  FNOX_NO_GH_PROXY: "1"

jobs:
  build:
    name: 检查上游 / 构建 / 发布
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 后面要 push 回 main，用带写权限的 token 检出
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          # 关掉 setup-go 自带的缓存：它按仓库里的 go.sum 算 key，而占大头的
          # 上游依赖（构建时才下载到 .local-build/upstream-src）不在仓库里，
          # 缓存基本命中不了。下面用上游 tag 当 key 自己缓存，更准。
          cache: false

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: 检查上游是否有新版本
        id: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '--force' || '' }}
        run: |
          set -euo pipefail
          # 说明/校验和写到 runner 临时目录，不落进仓库工作区（免得被误提交）
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"
          python scripts/upstream_sync.py check \
            --repo "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT" \
            --notes-out "$NOTES_FILE" \
            ${FORCE_FLAG}
          {
            echo "### 上游检查"
            echo ""
            echo "- 是否需要构建：\`${{ steps.upstream.outputs.changed }}\`（原因：${{ steps.upstream.outputs.reason }}）"
            echo "- 上游 tag：\`${{ steps.upstream.outputs.tag }}\`"
            echo "- 包版本：\`${{ steps.upstream.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Go 模块缓存按上游 tag 分桶：tag 变了说明依赖可能变，自然换一份新缓存，
      # 不会拿旧依赖去编译新源码。恢复不到只是慢一点，不影响正确性。
      - name: 缓存 Go 模块
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ steps.upstream.outputs.tag }}-${{ hashFiles('fngateway/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ steps.upstream.outputs.tag }}-
            gomod-${{ runner.os }}-

      - name: 无更新，跳过
        if: steps.upstream.outputs.changed != 'true'
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "上游无新版本，本次不构建、不提交、不发布。" >> "$GITHUB_STEP_SUMMARY"

      # release-missing 场景下 tag 与当前锁定相同，bump 会识别为"无需更新"直接返回，
      # 只重建重发，不会改坏仓库文件。
      - name: 同步版本号到仓库文件
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python scripts/upstream_sync.py bump \
            --tag "${{ steps.upstream.outputs.tag }}" \
            --notes-file "$NOTES_FILE"

      - name: 构建 fpk（amd64 + arm64）
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python build.py --arch all

      # 顺序很关键：先把包建出来，确认能构建，再把版本号提交回 main。
      # 否则 main 上会留下一个"版本号已改但根本构建不出来"的提交。
      - name: 提交版本号并推回 main
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898382+github-actions[bot]@users.noreply.github.com"
          git add build.py manifest README.md
          if git diff --cached --quiet; then
            echo "仓库文件无变化（补发场景），跳过提交" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "chore: 同步上游 ${{ steps.upstream.outputs.tag }}（包版本 ${{ steps.upstream.outputs.version }}）"
          # 构建要十几分钟，期间 main 可能被别人推进过；先 rebase 再推，
          # 避免 non-fast-forward 直接失败。真冲突就停下交人工判断，不强行覆盖。
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 收集构建产物
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          ls -l ./*.fpk
          # 放在工作区根目录：这一步在「提交」之后，不会被提交进去
          sha256sum ./*.fpk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # 同一 tag 重复发布会因"已存在"失败，留下 tag/Release 不一致；先删再建。
      # tag 用的是上游 tag（v0.6.14 这种），和上游版本一一对应，便于对照。
      - name: 创建 Release
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.upstream.outputs.tag }}"
          VER="${{ steps.upstream.outputs.version }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          if [ -s "$NOTES_FILE" ]; then
            BODY_ARGS=(--notes-file "$NOTES_FILE")
          else
            BODY_ARGS=(--generate-notes)
          fi
          gh release create "$TAG" \
            --title "cli2api $VER（上游 $TAG）" \
            "${BODY_ARGS[@]}" \
            ./*.fpk SHA256SUMS.txt

      # 发布用的资产之外再留一份 Actions 产物，方便排查和重发
      - name: 上传构建产物
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fpk-${{ steps.upstream.outputs.version }}
          path: |
            *.fpk
            SHA256SUMS.txt
          retention-days: 14
